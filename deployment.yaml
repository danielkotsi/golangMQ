apiVersion: apps/v1
kind: Deployment

metadata:
  name: my-broker

spec:
  replicas: 1

  selector:
    matchLabels:
      app: my-broker

  template:
    metadata:
      labels:
        app: my-broker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"

    spec:
      containers:
        - name: my-broker
          image: danielkotsi/golangmq:latest
          ports:
            - containerPort: 5672
            - containerPort: 9090